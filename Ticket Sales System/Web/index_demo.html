<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Ticket Sales Dashboard</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <script type="text/javascript" src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .stat-bar { text-align: center; color: #0056b3; font-size: 1.2em; margin-bottom: 20px; }
        .stat-bar span { margin: 0 20px; }
        .row { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; flex: 1; min-width: 300px; }
        .card h3 { margin-top: 0; color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 8px; }
        .card.full { max-width: 1200px; margin: 0 auto 20px; }
        .filters { margin-bottom: 12px; }
        .filters label { margin-right: 20px; font-weight: bold; color: #555; }
        .filters select { padding: 4px 8px; }
        table.vip { width: 100%; border-collapse: collapse; }
        table.vip th, table.vip td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        table.vip th { background-color: #0056b3; color: white; }
        .note { text-align: center; color: #888; font-size: 0.9em; margin-top: 20px; }
    </style>

    <script>
        // ---- Mock data (same 10 ticket sales as the Oracle sample data) ----
        var mockData = [
            {"ticket_id": 5001, "game_id": 101, "fan_id": 1, "tier_code": "VIP", "section_row": "Row 1", "seat_number": 12, "purchase_price": 2500.00},
            {"ticket_id": 5002, "game_id": 101, "fan_id": 5, "tier_code": "LWR", "section_row": "Row A", "seat_number": 101, "purchase_price": 450.00},
            {"ticket_id": 5003, "game_id": 101, "fan_id": 3, "tier_code": "UPR", "section_row": "Row 20", "seat_number": 15, "purchase_price": 85.50},
            {"ticket_id": 5004, "game_id": 102, "fan_id": 2, "tier_code": "LWR", "section_row": "Row F", "seat_number": 44, "purchase_price": 320.00},
            {"ticket_id": 5005, "game_id": 102, "fan_id": 2, "tier_code": "LWR", "section_row": "Row F", "seat_number": 45, "purchase_price": 320.00},
            {"ticket_id": 5006, "game_id": 102, "fan_id": 6, "tier_code": "UPR", "section_row": "Row 5", "seat_number": 10, "purchase_price": 60.00},
            {"ticket_id": 5007, "game_id": 103, "fan_id": 3, "tier_code": "BOX", "section_row": "Suite 1", "seat_number": 1, "purchase_price": 5000.00},
            {"ticket_id": 5008, "game_id": 103, "fan_id": 4, "tier_code": "UPR", "section_row": "Row 30", "seat_number": 22, "purchase_price": 55.00},
            {"ticket_id": 5009, "game_id": 104, "fan_id": 6, "tier_code": "LWR", "section_row": "Row B", "seat_number": 12, "purchase_price": 210.00},
            {"ticket_id": 5010, "game_id": 104, "fan_id": 1, "tier_code": "VIP", "section_row": "Row 1", "seat_number": 5, "purchase_price": 1800.00}
        ];

        // Lookup tables (mirror the Fan and NBA_game tables)
        var games = {
            101: "Lakers vs Warriors",
            102: "Celtics vs Heat",
            103: "Knicks vs Nets",
            104: "Bulls vs Bucks"
        };
        var fans = {
            1: "johndoe88",
            2: "AliceWonder",
            3: "MikeJ_Hoops",
            4: "S_Connor",
            5: "DLee_SF",
            6: "EmWhite"
        };

        function money(n) {
            return "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        $(document).ready(function () {
            // ---- Top stats ----
            var totalRevenue = mockData.reduce(function (sum, item) { return sum + item.purchase_price; }, 0);
            $("#stat-tickets").text("Total Tickets Sold: " + mockData.length);
            $("#stat-revenue").text("Total Revenue: " + money(totalRevenue));

            // ---- Revenue by game (mirrors analytical query #1) ----
            var revenueByGame = {};
            mockData.forEach(function (item) {
                revenueByGame[item.game_id] = (revenueByGame[item.game_id] || 0) + item.purchase_price;
            });
            var gameIds = Object.keys(revenueByGame).sort();
            new Chart($("#revenueChart"), {
                type: "bar",
                data: {
                    labels: gameIds.map(function (id) { return games[id]; }),
                    datasets: [{
                        label: "Revenue ($)",
                        data: gameIds.map(function (id) { return revenueByGame[id]; }),
                        backgroundColor: "#0056b3"
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { y: { ticks: { callback: function (v) { return "$" + v.toLocaleString(); } } } }
                }
            });

            // ---- VIP customers: total spent > $2000 (mirrors analytical query #2) ----
            var spentByFan = {};
            mockData.forEach(function (item) {
                spentByFan[item.fan_id] = (spentByFan[item.fan_id] || 0) + item.purchase_price;
            });
            var vips = Object.keys(spentByFan)
                .filter(function (fanId) { return spentByFan[fanId] > 2000; })
                .sort(function (a, b) { return spentByFan[b] - spentByFan[a]; });
            vips.forEach(function (fanId) {
                $("#vipBody").append(
                    "<tr><td>" + fans[fanId] + "</td><td>" + money(spentByFan[fanId]) + "</td></tr>"
                );
            });
            if (vips.length === 0) {
                $("#vipBody").append("<tr><td colspan='2'>No VIP customers yet.</td></tr>");
            }

            // ---- Main sales table with game / tier filters ----
            var table = $("#mainTable").DataTable({
                data: mockData,
                columns: [
                    { data: "ticket_id", title: "Ticket ID" },
                    { data: "game_id", title: "Game",
                      render: function (id) { return games[id] + " (#" + id + ")"; } },
                    { data: "fan_id", title: "Fan",
                      render: function (id) { return fans[id]; } },
                    { data: "tier_code", title: "Seat Tier" },
                    { data: "section_row", title: "Row" },
                    { data: "seat_number", title: "Seat Num" },
                    {
                        data: "purchase_price",
                        title: "Price ($)",
                        render: $.fn.dataTable.render.number(",", ".", 2, "$")
                    }
                ],
                pagingType: "full_numbers",
                pageLength: 10,
                columnDefs: [{ className: "dt-center", targets: "_all" }]
            });

            // Build filter dropdown options from the data
            gameIds.forEach(function (id) {
                $("#gameFilter").append("<option value='" + id + "'>" + games[id] + "</option>");
            });
            var tiers = [];
            mockData.forEach(function (item) {
                if (tiers.indexOf(item.tier_code) === -1) tiers.push(item.tier_code);
            });
            tiers.sort().forEach(function (t) {
                $("#tierFilter").append("<option value='" + t + "'>" + t + "</option>");
            });

            // Apply filters: Game ID is column 1, Seat Tier is column 3
            $("#gameFilter").on("change", function () {
                table.column(1).search(this.value).draw();
            });
            $("#tierFilter").on("change", function () {
                table.column(3).search(this.value).draw();
            });
        });
    </script>
</head>
<body>
    <h1>NBA Ticket Sales Management System</h1>
    <div class="stat-bar">
        <span id="stat-tickets">Loading...</span>
        <span id="stat-revenue"></span>
    </div>

    <div class="row">
        <div class="card">
            <h3>Revenue by Game</h3>
            <canvas id="revenueChart"></canvas>
        </div>
        <div class="card">
            <h3>VIP Customers <small style="color:#888">(spent &gt; $2,000)</small></h3>
            <table class="vip">
                <thead><tr><th>Username</th><th>Total Spent</th></tr></thead>
                <tbody id="vipBody"></tbody>
            </table>
        </div>
    </div>

    <div class="card full">
        <h3>All Ticket Sales</h3>
        <div class="filters">
            <label>Game:
                <select id="gameFilter"><option value="">All games</option></select>
            </label>
            <label>Seat Tier:
                <select id="tierFilter"><option value="">All tiers</option></select>
            </label>
        </div>
        <table id="mainTable" class="display" style="width:100%"></table>
    </div>

    <p class="note">Demo dashboard — all figures are computed in the browser from mock data.</p>
</body>
</html>
